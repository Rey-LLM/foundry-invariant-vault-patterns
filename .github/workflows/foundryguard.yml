name: FoundryGuard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    env:
      # The parser needs a compiler; with these set, compile tests fail instead of being skipped.
      FOUNDRYGUARD_REQUIRE_SOLC: "1"
      FOUNDRYGUARD_REQUIRE_LIBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install solc 0.8.24
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/solc" https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux
          chmod +x "$HOME/.local/bin/solc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: solc --version
      - name: Install OpenZeppelin and Solady for the lineage fixture
        run: npm install --prefix tests/foundryguard/fixtures/libs --no-audit --no-fund --no-package-lock
      - run: pip install .
      - run: python -m unittest discover -s tests/foundryguard -v

  forge:
    name: Generated suites build and run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/foundryguard/fixtures/project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Solidity dependencies
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
      - name: Generate suites (solc AST through forge build)
        run: python3 ../../../../src/cli/foundryguard.py run --compiler forge --report-md "$GITHUB_STEP_SUMMARY"
      - name: Compile generated suites
        run: forge build
      - name: Run generated invariants
        run: |
          forge test --match-path "test/foundryguard/*" --list
          forge test --match-path "test/foundryguard/*" -vv || true
          forge test --match-path "test/foundryguard/*" --json > forge-results.json || true
          python3 ../../../../src/cli/foundryguard.py report forge-results.json --md forge-results.md --sarif foundryguard.sarif --fail-on-failure
      - if: always()
        run: cat forge-results.md >> "$GITHUB_STEP_SUMMARY" || true

  catches-bugs:
    name: Generated suite catches a planted bug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/foundryguard/fixtures/broken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: python3 ../../../../src/cli/foundryguard.py run
      - name: The planted bug must be reported
        run: |
          forge test --match-path "test/foundryguard/*" -vv || true
          forge test --match-path "test/foundryguard/*" --json > forge-results.json || true
          python3 ../../../../src/cli/foundryguard.py report forge-results.json --md forge-results.md
          if python3 ../../../../src/cli/foundryguard.py report forge-results.json --fail-on-failure > /dev/null; then
            echo "::error::FoundryGuard did not catch the LeakyVault bug"
            exit 1
          fi
      - name: Collect forge JSON results with the failure events from stderr
        run: |
          forge test --match-path "test/foundryguard/*" --json > forge-results.json 2> forge-stderr.txt || true
          cat forge-stderr.txt >> forge-results.json
      - name: FoundryGuard_Report.md documents the counter-example (JSON and stdout input)
        run: |
          python3 ../../../../src/cli/foundryguard.py report forge-results.json > /dev/null
          echo "persisted failures:"; find cache/invariant -type f -print -exec head -c 400 {} \; -exec echo \; 2>/dev/null || true
          must() { grep -qE "$1" "$2" || { echo "::error::$2 lacks: $1"; cat "$2"; exit 1; }; }
          must "FoundryGuard-FAILED" FoundryGuard_Report.md
          must "Counter-example call trace" FoundryGuard_Report.md
          # The leak breaks both accounting invariants; the fuzzer reports whichever it hits first.
          must "invariant_(tokenSolvency|actorBalancesBoundedByTotal)" FoundryGuard_Report.md
          forge test --match-path "test/foundryguard/*" -vvv > forge-output.txt || true
          python3 ../../../../src/cli/reporter.py forge-output.txt -o report-from-stdout.md
          must "Counter-example call trace" report-from-stdout.md
          cat FoundryGuard_Report.md >> "$GITHUB_STEP_SUMMARY"

  self-heal:
    name: Heal loop repairs a handler forge rejects
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/foundryguard/fixtures/broken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - name: Generate (the heal loop compiles the suites with forge build --json)
        run: python3 ../../../../src/cli/foundryguard.py run
      - name: Break the handler the way another solc version would reject it
        run: |
          H=test/foundryguard/LeakyVault/Handler.sol
          cp "$H" /tmp/Handler.clean.sol
          sed -i 's/address\[\] memory _tokens/address[] _tokens/; s/function actorCount() external view/function actorCount() view/' "$H"
          if forge build > /dev/null 2>&1; then echo "::error::the broken handler still compiles"; exit 1; fi
      - run: python3 ../../../../src/cli/foundryguard.py heal --compiler forge --strict
      - name: The healed suite builds and the fixes are recorded
        run: |
          forge build
          grep -q "address\[\] memory _tokens" test/foundryguard/LeakyVault/Handler.sol
          grep -q '"data-location"' test/foundryguard/foundryguard.heal.json

  hook-reentrancy:
    name: Preset 04 catches hook read-reentrancy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/foundryguard/fixtures/hooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: python3 ../../../../src/cli/foundryguard.py run --compiler forge
      - run: forge build
      - name: HookedVault must fail, GuardedHookVault and UnlockPool must pass
        run: |
          forge test --match-path "test/foundryguard/*" -vvv | tee forge-output.txt || true
          forge test --match-path "test/foundryguard/*" --json > forge-results.json 2> forge-stderr.txt || true
          cat forge-stderr.txt >> forge-results.json
          python3 ../../../../src/cli/foundryguard.py report forge-results.json > /dev/null
          python3 ../../../../src/cli/reporter.py forge-output.txt -o report-from-stdout.md
          grep -q "invariant_hook_readConsistency" report-from-stdout.md
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "../../../../src/cli")
          import reporter
          run = reporter.load("forge-results.json")
          failed = {t.contract for t in run.failures}
          print("failed suites:", sorted(failed))
          names = {t.name for t in run.failures if t.contract == "HookedVaultGuardInvariantTest"}
          assert "invariant_hook_readConsistency()" in names, f"wrong invariant reported: {names}"
          assert "HookedVaultGuardInvariantTest" in failed, "Preset 04 did not catch the HookedVault read-reentrancy bug"
          assert not failed - {"HookedVaultGuardInvariantTest"}, f"false positive on a safe contract: {failed}"
          print("HookedVault failures:", sorted(names))
          PY
      - if: always()
        run: cat FoundryGuard_Report.md >> "$GITHUB_STEP_SUMMARY" || true

  transient-storage:
    name: Preset 05 catches a transient slot left set between calls
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/foundryguard/fixtures/transient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: python3 ../../../../src/cli/foundryguard.py run --compiler forge
      - run: forge build
      - name: LeakyTransientStaking must fail the transient check, TransientStaking must pass
        run: |
          forge test --match-path "test/foundryguard/*" -vvv | tee forge-output.txt || true
          forge test --match-path "test/foundryguard/*" --json > forge-results.json 2> forge-stderr.txt || true
          cat forge-stderr.txt >> forge-results.json
          python3 ../../../../src/cli/foundryguard.py report forge-results.json > /dev/null
          python3 ../../../../src/cli/reporter.py forge-output.txt -o report-from-stdout.md
          grep -q "invariant_transient_slotsClearedBetweenCalls" report-from-stdout.md
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "../../../../src/cli")
          import reporter
          run = reporter.load("forge-results.json")
          failed = {t.contract for t in run.failures}
          print("failed suites:", sorted(failed))
          names = {t.name for t in run.failures if t.contract == "LeakyTransientStakingGuardInvariantTest"}
          assert "LeakyTransientStakingGuardInvariantTest" in failed, "Preset 05 did not catch the leaked transient slot"
          assert "invariant_transient_slotsClearedBetweenCalls()" in names, f"wrong invariant reported: {names}"
          assert not failed - {"LeakyTransientStakingGuardInvariantTest"}, f"false positive on the fixed contract: {failed}"
          print("LeakyTransientStaking failures:", sorted(names))
          PY
      - if: always()
        run: cat FoundryGuard_Report.md >> "$GITHUB_STEP_SUMMARY" || true

  ecosystem:
    name: Layer 07 catches a vault that breaks when its oracle moves
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/foundryguard/fixtures/ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: python3 ../../../../src/cli/foundryguard.py run --compiler forge
      - run: forge build
      - name: The PriceFeed ecosystem must fail on LeakyOracleVault solvency only
        run: |
          test ! -e test/foundryguard/OracleVault && test ! -e test/foundryguard/LeakyOracleVault
          forge test --match-path "test/foundryguard/*" -vvv | tee forge-output.txt || true
          forge test --match-path "test/foundryguard/*" --json > forge-results.json 2> forge-stderr.txt || true
          cat forge-stderr.txt >> forge-results.json
          python3 ../../../../src/cli/foundryguard.py report forge-results.json > /dev/null
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "../../../../src/cli")
          import reporter
          run = reporter.load("forge-results.json")
          names = {t.name for t in run.failures}
          print("failed invariants:", sorted(names))
          assert "invariant_ecosystem_LeakyOracleVault_tokenSolvency()" in names, "Layer 07 did not catch the oracle-driven insolvency"
          assert all("LeakyOracleVault" in n for n in names), f"false positive outside LeakyOracleVault: {names}"
          PY
      - name: Without the leaky vault the ecosystem passes
        run: |
          rm -rf test/foundryguard
          printf '[targets]\nexclude = ["LeakyOracleVault"]\n' > foundryguard.toml
          python3 ../../../../src/cli/foundryguard.py run --compiler forge
          forge test --match-path "test/foundryguard/*" -vv
      - if: always()
        run: cat FoundryGuard_Report.md >> "$GITHUB_STEP_SUMMARY" || true

  patterns:
    name: AST parser maps the repo patterns (ERC-4626, TWAP, Staking, Transient)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install solc 0.8.24
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/solc" https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux
          chmod +x "$HOME/.local/bin/solc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Solidity dependencies
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
      - name: Scan and generate with the native solc driver
        run: python3 src/cli/foundryguard.py run --compiler solc -o foundryguard.json
      - name: Every pattern is mapped from the AST
        run: |
          python3 - <<'PY'
          import json
          bp = json.load(open("foundryguard.json"))
          assert bp["compiler"]["driver"] == "solc", bp["compiler"]
          cs = {c["name"]: c for c in bp["contracts"] if not c["external"]}
          vault = cs["MockERC4626"]
          assert [f.split(":")[1] for f in vault["linearized_bases"][:3]] == ["MockERC4626", "ERC4626", "IERC4626"], vault["linearized_bases"]
          assert "IERC4626" in vault["interfaces"]
          assert cs["FloorWithdrawERC4626"]["linearized_bases"][1] == "src/erc4626-inflation/MockERC4626.sol:MockERC4626"
          assert cs["StakingPool"]["categories"] == {"stake_lock": ["stake(uint256)", "unstake(uint256)", "claim()"]}
          oracle = {f["name"]: f for f in cs["PriceOracleModel"]["functions"]}
          assert oracle["updatePrice"]["mutability"] == "nonpayable" and oracle["consult"]["mutability"] == "view"
          assert oracle["_checkBounds"]["mutability"] == "pure"
          assert cs["Handler"]["test_helper"], "src/erc4626-inflation/Handler.sol imports forge-std"
          tr = cs["TransientStaking"]["transient"]
          assert len(tr["tstore_slots"]) == 2 and "modifier nonReentrant" in tr["sites"], tr
          assert cs["LeakyTransientStaking"]["linearized_bases"][1] == "src/transient-vault/TransientStaking.sol:TransientStaking"
          print("mapped:", sorted(cs))
          PY
      - name: Generated and hand-written suites compile together
        run: forge build
      - name: Module 05 hand-written suite (transient storage)
        run: forge test --match-path "test/transient-vault/*" -vv

  libraries:
    name: OpenZeppelin and Solady parents from the AST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/foundryguard/fixtures/libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: forge install foundry-rs/forge-std --no-git
      - run: python3 ../../../../src/cli/foundryguard.py run --compiler forge -o foundryguard.json
      - name: Lineage resolved by fqn through forge's AST
        run: |
          python3 - <<'PY'
          import json
          bp = json.load(open("foundryguard.json"))
          cs = {c["name"]: c for c in bp["contracts"] if not c["external"]}
          assert cs["SoladyShare"]["bases"][0]["fqn"].endswith("solady/src/tokens/ERC20.sol:ERC20"), cs["SoladyShare"]["bases"]
          assert cs["OZShare"]["bases"][0]["fqn"].endswith("openzeppelin/contracts/token/ERC20/ERC20.sol:ERC20"), cs["OZShare"]["bases"]
          assert [f.split(":")[1] for f in cs["SoladyVault"]["linearized_bases"]] == ["SoladyVault", "Ownable", "ERC4626", "ERC20"]
          print("ok")
          PY
      - name: Generated suites compile
        run: forge build
