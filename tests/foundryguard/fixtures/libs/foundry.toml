[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
# @openzeppelin/contracts resolves through node_modules (Hardhat layout), Solady through a remapping.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=node_modules/solady/src/",
]
